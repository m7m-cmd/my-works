<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أرشيف أعمالي الجامعية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#1f6f5c;--on:#fff;--ac2:#e3f1ed;--bd:#e2e0d9;--dg:#b3382c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--card:#202220;--tx:#eeede8;--mut:#9c9a93;--ac:#5cc4a8;--on:#111;--ac2:#1f3a33;--bd:#33362f;--dg:#ff8a7d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--tx)}
input[type=text],input[type=email],select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-bottom:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:11px 16px;cursor:pointer;width:100%}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tab{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer}
.tab.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between}
.item a{color:var(--tx);font-weight:600;cursor:pointer;word-break:break-word}
.meta{color:var(--mut);font-size:.8rem}
.del,.out{background:none;border:0;color:var(--dg);cursor:pointer;padding:6px}
.out{color:var(--mut);float:left}
.msg{color:var(--mut);text-align:center;padding:20px}
</style>
</head>
<body>
<main>
<h1>📚 أرشيف أعمالي الجامعية</h1>

<div id="err" class="meta" style="color:#c0392b;margin-bottom:8px"></div>
<div id="login" class="card">
  <p>سجّل الدخول ببريدك وكلمة السر.</p>
  <input type="email" id="email" placeholder="البريد الإلكتروني" autocomplete="username">
  <input type="password" id="pw" placeholder="كلمة السر" autocomplete="current-password" style="width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-bottom:8px">
  <button class="btn" id="send">دخول</button>
  <div class="meta" id="lmsg"></div>
</div>

<div id="app" hidden>
  <button class="out" id="logout">خروج</button>
  <div class="card" style="clear:both">
    <input type="text" id="title" placeholder="عنوان العمل (اختياري)">
    <div class="row">
      <select id="cat"><option>أبحاث</option><option>مشاريع</option><option>عروض تقديمية</option><option>تكليفات</option></select>
      <input type="text" id="course" placeholder="المادة">
    </div>
    <input type="file" id="file" multiple style="width:100%;margin-bottom:8px">
    <button class="btn" id="go">رفع</button>
    <div class="meta" id="st"></div>
  </div>
  <input type="text" id="q" placeholder="🔍 ابحث بالعنوان أو المادة">
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>
</main>
<script>
const SUPABASE_URL="https://jtlnqxwicxsvnqadqbpl.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_VsnqA4oVHQw197uGVfe07g_ZC92kiMu";
window.addEventListener("error",e=>{document.getElementById("err").textContent="خطأ: "+e.message});
if(typeof supabase==="undefined"){document.getElementById("err").textContent="تعذّر تحميل مكتبة Supabase، جرّب شبكة أخرى أو حدّث الصفحة."}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const CATS=["الكل","أبحاث","مشاريع","عروض تقديمية","تكليفات"];
let works=[],cat="الكل";
const $=id=>document.getElementById(id);
const fmt=b=>!b?"":b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";

function tabs(){$("tabs").innerHTML="";CATS.forEach(c=>{const b=document.createElement("button");
  b.className="tab"+(c===cat?" on":"");b.textContent=c;b.onclick=()=>{cat=c;tabs();render()};$("tabs").appendChild(b)})}

function render(){
  const q=$("q").value.trim().toLowerCase(),box=$("list");box.innerHTML="";
  const rows=works.filter(w=>(cat==="الكل"||w.category===cat)&&(!q||(w.title+" "+(w.course||"")).toLowerCase().includes(q)));
  if(!rows.length){box.innerHTML='<div class="msg">لا توجد ملفات هنا بعد.</div>';return}
  rows.forEach(w=>{
    const d=document.createElement("div");d.className="card item";
    const l=document.createElement("div"),a=document.createElement("a"),m=document.createElement("div");
    a.textContent=w.title;a.onclick=()=>openFile(w);
    m.className="meta";m.textContent=[w.category,w.course,fmt(w.size),new Date(w.created_at).toLocaleDateString("ar")].filter(Boolean).join(" · ");
    l.append(a,m);
    const x=document.createElement("button");x.className="del";x.textContent="حذف";x.onclick=()=>del(w);
    d.append(l,x);box.appendChild(d);
  });
}
async function openFile(w){
  const win=window.open("","_blank");
  const {data,error}=await sb.storage.from("works").createSignedUrl(w.path,300);
  if(error){if(win)win.close();alert("تعذّر فتح الملف");return}
  if(win)win.location=data.signedUrl;else location=data.signedUrl;
}
async function del(w){
  if(!confirm("حذف هذا الملف نهائيًا؟"))return;
  const r=await sb.storage.from("works").remove([w.path]);
  if(r.error){alert("تعذّر الحذف");return}
  await sb.from("works").delete().eq("id",w.id);load();
}
async function load(){
  const {data,error}=await sb.from("works").select("*").order("created_at",{ascending:false});
  if(error){$("list").innerHTML='<div class="msg">تعذّر تحميل الملفات.</div>';return}
  works=data;render();
}
$("q").oninput=render;
$("go").onclick=async()=>{
  const fs=[...$("file").files];if(!fs.length){$("st").textContent="اختر ملفًا أولًا";return}
  $("go").disabled=true;
  try{
    for(let i=0;i<fs.length;i++){
      const f=fs[i];$("st").textContent=`جاري رفع ${i+1}/${fs.length}…`;
      const ext=(f.name.match(/\.[A-Za-z0-9]{1,8}$/)||[""])[0],path=crypto.randomUUID()+ext;
      const u=await sb.storage.from("works").upload(path,f,{contentType:f.type||"application/octet-stream"});
      if(u.error)throw u.error;
      const r=await sb.from("works").insert({title:(fs.length===1&&$("title").value.trim())||f.name,
        category:$("cat").value,course:$("course").value.trim()||null,path,size:f.size,source:"web"});
      if(r.error)throw r.error;
    }
    $("st").textContent="تم الرفع ✓";$("file").value="";$("title").value="";load();
  }catch(e){$("st").textContent="تعذّر الرفع: "+(e.message||"خطأ")}
  $("go").disabled=false;
};
$("send").onclick=async()=>{
  const email=$("email").value.trim(),password=$("pw").value;if(!email||!password)return;
  $("lmsg").textContent="جاري الدخول…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  $("lmsg").textContent=error?"تعذّر الدخول: "+error.message:"";
};
$("logout").onclick=()=>sb.auth.signOut();

function show(session){$("login").hidden=!!session;$("app").hidden=!session;if(session)load()}
sb.auth.onAuthStateChange((_e,s)=>show(s));
tabs();
</script>
</body>
</html>
